<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面共有（送信）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: -apple-system, "Hiragino Sans", sans-serif; background: #14161a; color: #f2f3f5; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #9aa3ad; font-size: 13px; margin-bottom: 14px; }
  #stage { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; touch-action: none; }
  #srcVideo { width: 100%; height: 100%; display: block; touch-action: none; }
  #selRect { position: absolute; border: 2px solid #ffd94d; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); display: none; cursor: move; touch-action: none; }
  #selHandle { position: absolute; right: 4px; bottom: 4px; width: 26px; height: 26px; background: #ffd94d; border-radius: 4px; cursor: nwse-resize; touch-action: none; }
  .row { display: flex; gap: 8px; flex-wrap: nowrap; margin: 12px 0; }
  button { flex: 1; white-space: nowrap; font-size: 15px; font-weight: 600; padding: 12px 6px; border: 0; border-radius: 10px; background: #2f6fed; color: #fff; cursor: pointer; }
  button.sub2 { background: #3a3f46; }
  button.preset { background: #262b33; border: 1px solid #3a3f46; font-size: 14px; padding: 9px 4px; }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: #9aa3ad; font-size: 12px; margin: 4px 0 0; }
  .sendwrap { display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; }
  #sendPreview { width: 240px; max-width: 55%; background: #000; border: 1px solid #ffd94d; border-radius: 8px; }
  .card { background: #1d2026; border: 1px solid #2c3038; border-radius: 12px; padding: 12px; margin: 12px 0; }
  .code { font-size: 30px; font-weight: 700; letter-spacing: 4px; text-align: center; }
  .url { font-size: 12px; word-break: break-all; color: #9fd0ff; text-align: center; margin-top: 6px; }
  #qr { display: block; margin: 10px auto 2px; width: 180px; height: 180px; background: #fff; border-radius: 8px; }
  #log { font-size: 12px; color: #c8cdd4; white-space: pre-wrap; line-height: 1.7; }
  .ok { color: #7ee2a0; } .ng { color: #ff9c9c; }
</style>
</head>
<body>
<h1>🎥 画面共有（送信）</h1>
<div class="sub">iMac側のページ。画面かカメラを取り込んで、スマホへ送ります。音声はSpoon側に任せる前提で、映像だけ送ります。</div>

<div id="stage">
  <video id="srcVideo" autoplay muted playsinline></video>
  <div id="selRect"><div id="selHandle"></div></div>
</div>
<div class="row" style="margin-top:10px;">
  <button class="preset" id="btnFull">全体</button>
  <button class="preset" id="btn169">16:9</button>
  <button class="preset" id="btn916">縦 9:16</button>
  <button class="preset" id="btn11">1:1</button>
</div>
<p class="hint">範囲指定：プレビューの上でドラッグすると範囲を作れます。全体のときは、そのままドラッグで新しい範囲を描けます。黄色い枠の中をドラッグで移動、右下の四角をドラッグで大きさ変更。送られるのは黄色い枠の中だけです。</p>

<div class="row">
  <button id="btnScreen">画面を開始</button>
  <button id="btnCam" class="sub2">カメラ</button>
  <button id="btnStop" class="sub2" disabled>停止</button>
</div>

<div class="sendwrap">
  <video id="sendPreview" autoplay muted playsinline></video>
  <div class="hint" style="margin:0;">← 送信中の映像<br>（黄色い枠の中が、この形でスマホに届きます）</div>
</div>

<div class="card">
  <div style="text-align:center;font-size:13px;color:#9aa3ad;">スマホで開く視聴ページ（合言葉）</div>
  <div class="code" id="roomCode">------</div>
  <img id="qr" alt="視聴ページのQRコード">
  <div class="url" id="watchUrl"></div>
  <div class="row" style="margin-bottom:0;">
    <button id="btnCopy" class="sub2">URLをコピー</button>
    <button id="btnNewCode" class="sub2">合言葉を作り直す</button>
  </div>
</div>

<div class="card">
  <div style="font-size:13px;color:#9aa3ad;margin-bottom:4px;">状態</div>
  <div id="log">準備中…</div>
</div>

<canvas id="cropCanvas" width="640" height="360" style="display:none;"></canvas>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var PREFIX = 'lila-vcast-';
  var ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $('log');
  function log(msg, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
  }
  function setLog(msg, cls) { logEl.innerHTML = ''; log(msg, cls); }

  // ---- region selection + crop ----
  var srcVideo = $('srcVideo');
  var stage = $('stage');
  var selRectEl = $('selRect');
  var canvas = $('cropCanvas');
  var ctx = canvas.getContext('2d');
  var sel = { x: 0, y: 0, w: 1, h: 1 }; // fractions of the source frame
  var rawStream = null;
  var outStream = null;
  var drawing = false;

  function renderSel() {
    selRectEl.style.display = rawStream ? 'block' : 'none';
    selRectEl.style.left = (sel.x * 100) + '%';
    selRectEl.style.top = (sel.y * 100) + '%';
    selRectEl.style.width = (sel.w * 100) + '%';
    selRectEl.style.height = (sel.h * 100) + '%';
  }
  function applyCanvasSize() {
    var vw = srcVideo.videoWidth, vh = srcVideo.videoHeight;
    if (!vw || !vh) return;
    var pw = Math.max(2, Math.round(sel.w * vw));
    var ph = Math.max(2, Math.round(sel.h * vh));
    var scale = Math.min(1, 1280 / Math.max(pw, ph));
    canvas.width = Math.max(2, Math.round(pw * scale));
    canvas.height = Math.max(2, Math.round(ph * scale));
  }
  function drawLoop() {
    if (srcVideo.videoWidth && srcVideo.readyState >= 2) {
      var vw = srcVideo.videoWidth, vh = srcVideo.videoHeight;
      try {
        ctx.drawImage(srcVideo, sel.x * vw, sel.y * vh, sel.w * vw, sel.h * vh, 0, 0, canvas.width, canvas.height);
      } catch (e) {}
    }
    if (drawing) requestAnimationFrame(drawLoop);
  }
  function setSelFull() { sel = { x: 0, y: 0, w: 1, h: 1 }; renderSel(); applyCanvasSize(); }
  function setSelAspect(ta) {
    var vw = srcVideo.videoWidth, vh = srcVideo.videoHeight;
    if (!vw || !vh) { log('まず画面かカメラを開始してください。', 'ng'); return; }
    var va = vw / vh;
    var w, h;
    if (ta / va <= 1) { h = 1; w = ta / va; } else { w = 1; h = va / ta; }
    sel = { x: (1 - w) / 2, y: (1 - h) / 2, w: w, h: h };
    renderSel(); applyCanvasSize();
  }

  // pointer interaction on the stage
  var drag = null;
  function fracPos(ev) {
    var r = stage.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))
    };
  }
  stage.addEventListener('pointerdown', function (ev) {
    if (!rawStream) return;
    var pos = fracPos(ev);
    var prev = { x: sel.x, y: sel.y, w: sel.w, h: sel.h };
    var r = stage.getBoundingClientRect();
    var edgeX = r.width > 0 ? 14 / r.width : 0;   // right-edge resize zone (~14px inside)
    var edgeY = r.height > 0 ? 14 / r.height : 0; // bottom-edge resize zone (~14px inside)
    var inside = pos.x >= sel.x && pos.x <= sel.x + sel.w && pos.y >= sel.y && pos.y <= sel.y + sel.h;
    var isFull = sel.w >= 0.999 && sel.h >= 0.999;
    if (ev.target === $('selHandle')) {
      drag = { mode: 'resize', prev: prev, edges: { right: true, bottom: true } };
    } else if (isFull) {
      // Full-frame selection: dragging anywhere (even inside) starts a new range.
      drag = { mode: 'draw', sx: pos.x, sy: pos.y, prev: prev };
      sel = { x: pos.x, y: pos.y, w: 0.01, h: 0.01 };
    } else if (inside && (pos.x >= sel.x + sel.w - edgeX || pos.y >= sel.y + sel.h - edgeY)) {
      // Edge resize: only the grabbed edge's axis follows the pointer.
      drag = { mode: 'resize', prev: prev, edges: {
        right: pos.x >= sel.x + sel.w - edgeX,
        bottom: pos.y >= sel.y + sel.h - edgeY
      } };
    } else if (inside) {
      drag = { mode: 'move', dx: pos.x - sel.x, dy: pos.y - sel.y, prev: prev };
    } else {
      drag = { mode: 'draw', sx: pos.x, sy: pos.y, prev: prev };
      sel = { x: pos.x, y: pos.y, w: 0.01, h: 0.01 };
    }
    stage.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });
  stage.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var pos = fracPos(ev);
    if (drag.mode === 'draw') {
      sel.x = Math.min(drag.sx, pos.x); sel.y = Math.min(drag.sy, pos.y);
      sel.w = Math.max(0.02, Math.abs(pos.x - drag.sx)); sel.h = Math.max(0.02, Math.abs(pos.y - drag.sy));
    } else if (drag.mode === 'move') {
      sel.x = Math.min(1 - sel.w, Math.max(0, pos.x - drag.dx));
      sel.y = Math.min(1 - sel.h, Math.max(0, pos.y - drag.dy));
    } else if (drag.mode === 'resize') {
      if (!drag.edges || drag.edges.right) sel.w = Math.min(1 - sel.x, Math.max(0.02, pos.x - sel.x));
      if (!drag.edges || drag.edges.bottom) sel.h = Math.min(1 - sel.y, Math.max(0.02, pos.y - sel.y));
    }
    renderSel();
  });
  stage.addEventListener('pointerup', function () {
    if (!drag) return;
    // Accidental click in draw mode (range stayed tiny): restore the previous selection.
    if (drag.mode === 'draw' && sel.w < 0.03 && sel.h < 0.03) {
      sel = { x: drag.prev.x, y: drag.prev.y, w: drag.prev.w, h: drag.prev.h };
      renderSel();
    }
    drag = null;
    applyCanvasSize();
  });
  stage.addEventListener('pointercancel', function () { drag = null; });

  $('btnFull').addEventListener('click', setSelFull);
  $('btn169').addEventListener('click', function () { setSelAspect(16 / 9); });
  $('btn916').addEventListener('click', function () { setSelAspect(9 / 16); });
  $('btn11').addEventListener('click', function () { setSelAspect(1); });

  // ---- share code -> bot (game109) ----
  // 部屋の合言葉を Firebase RTDB の shareCode へ知らせて、bot の管理画面「📺 画面共有」に
  // 自動で入るようにします。書き込みに失敗しても送信ページの動作は一切妨げません。
  var SHARE_DB_URL = 'https://podcastse-default-rtdb.firebaseio.com';
  function publishShareCode(value) {
    try {
      fetch(SHARE_DB_URL + '/shareCode.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: value || '', updatedAt: Date.now() }),
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }
  window.addEventListener('pagehide', function () { publishShareCode(''); });

  // ---- room code / peer ----
  function newCode() {
    var s = '';
    for (var i = 0; i < 6; i++) s += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
    return s;
  }
  var code = newCode();
  var peer = null;
  var viewers = {};

  function watchUrl() { return 'https://g-ya1027.github.io/watch.html?c=' + code; }
  function renderRoom() {
    $('roomCode').textContent = code;
    $('watchUrl').textContent = watchUrl();
    $('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(watchUrl());
  }
  renderRoom();

  function ensurePeer() {
    if (peer) {
      // 停止→再開などで peer が生きている場合は、開通済みの合言葉を改めて知らせる
      if (peer.open) publishShareCode(code);
      return;
    }
    peer = new Peer(PREFIX + code);
    peer.on('open', function () { log('受付を開始しました（合言葉: ' + code + '）', 'ok'); publishShareCode(code); });
    peer.on('connection', function (conn) {
      conn.on('open', function () {
        viewers[conn.peer] = true;
        log('スマホが接続しました。映像を送ります。');
        sendTo(conn.peer);
      });
      conn.on('close', function () { delete viewers[conn.peer]; });
    });
    peer.on('error', function (err) {
      log('接続で問題が起きました: ' + err.type, 'ng');
      if (err.type === 'unavailable-id') log('合言葉が重なったようです。「合言葉を作り直す」を押してください。', 'ng');
    });
    peer.on('disconnected', function () { try { peer.reconnect(); } catch (e) {} });
  }

  function sendTo(viewerId) {
    if (!outStream || !peer) return;
    try { peer.call(viewerId, outStream); } catch (e) { log('送信に失敗しました: ' + e.message, 'ng'); }
  }
  function sendToAll() { for (var id in viewers) sendTo(id); }

  function startStream(newStream, label) {
    if (rawStream) rawStream.getTracks().forEach(function (t) { t.stop(); });
    rawStream = newStream;
    srcVideo.srcObject = rawStream;
    $('btnStop').disabled = false;
    srcVideo.addEventListener('loadedmetadata', function onMeta() {
      srcVideo.removeEventListener('loadedmetadata', onMeta);
      stage.style.aspectRatio = srcVideo.videoWidth + ' / ' + srcVideo.videoHeight;
      setSelFull();
      if (!outStream) {
        outStream = canvas.captureStream(30);
        $('sendPreview').srcObject = outStream;
      }
      if (!drawing) { drawing = true; requestAnimationFrame(drawLoop); }
      ensurePeer();
      sendToAll();
    });
    setLog(label + 'を取り込みました。スマホの接続を待っています。黄色い枠で範囲を指定できます。', 'ok');
    rawStream.getVideoTracks().forEach(function (t) {
      t.addEventListener('ended', function () { stopAll(); });
    });
  }

  function stopAll() {
    if (rawStream) { rawStream.getTracks().forEach(function (t) { t.stop(); }); rawStream = null; }
    srcVideo.srcObject = null;
    drawing = false;
    $('btnStop').disabled = true;
    renderSel();
    publishShareCode('');
    log('停止しました。');
  }

  $('btnScreen').addEventListener('click', function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      setLog('このブラウザでは画面取り込みが使えません。Chromeで開いてください。', 'ng'); return;
    }
    navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false })
      .then(function (s) { startStream(s, '画面'); })
      .catch(function () { setLog('画面の取り込みがキャンセルされたか、許可されませんでした。', 'ng'); });
  });
  $('btnCam').addEventListener('click', function () {
    navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false })
      .then(function (s) { startStream(s, 'カメラ'); })
      .catch(function () { setLog('カメラが使えませんでした（許可が必要です）。', 'ng'); });
  });
  $('btnStop').addEventListener('click', stopAll);
  $('btnCopy').addEventListener('click', function () {
    if (navigator.clipboard) navigator.clipboard.writeText(watchUrl()).then(function () { log('URLをコピーしました。'); });
  });
  $('btnNewCode').addEventListener('click', function () {
    stopAll();
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    publishShareCode('');
    viewers = {};
    code = newCode();
    renderRoom();
    setLog('合言葉を作り直しました。画面かカメラを開始してください。');
  });

  setLog('「画面を開始」か「カメラ」を押してください。');
})();
</script>
</body>
</html>
