    kickTrainAnim86();
  }
  function submitTrainingLog() {
    if (!train || train.submitted || !train.state || !train.state.finished) return;
    if (train.test || train.trial) { train.submitted = true; return; } // game81: テスト対戦のログは提出しない。game93: お試しプレイも同様に提出しない
    train.submitted = true;
    var st = train.state;
    var log = {
      v: 1, day: train.day, seed: train.seed, snapshot: train.snapshot,
      npc: { level: st.npc.level, attr: st.npc.attr }, choices: train.choices.slice(),
      claim: { winner: st.winner, turns: st.history.length, playerHp: st.participants[0].hp, npcHp: st.participants[1].hp },
    };
    trainLocalBump();
    postOp({ kind: 'training_log', tokenHash: myHash, requestId: 'tr_' + Date.now() + '_' + Math.floor(Math.random() * 1e6), log: log }).catch(function () {});
  }
  function renderTraining() {
    if (view !== 'training') return;
    var box = el('viewTraining');
    if (!train || !train.state) {
      box.innerHTML = '<div class="panel"><div class="ptitle">🏃 訓練モード</div><div class="note">訓練の準備ができていません。ロビーから始めてください。</div>'
        + '<button class="btn small" id="trainBackBtn" type="button">ロビーへ</button></div>';
      el('trainBackBtn').addEventListener('click', function () { switchView('lobby'); });
      return;
    }
    var st = train.state;
    var me = st.participants[0];
    var foe = st.participants[1];
    // game86: 逐次再生中はコマンドを止め、結果表示を保留する。再描画で止まった再生は遅延キックで再開する
    var animating86 = !!(train.animBusy || (train.animQ && train.animQ.length));
    if (!train.animBusy && train.animQ && train.animQ.length) setTimeout(function () { kickTrainAnim86(); }, 0);
    var headLabel = train.trial ? '🎮 お試しプレイ中（記録されません）'
      : train.test
      ? (train.hidden ? '🌙 隠しキャラ戦（GKテスト・記録なし）' : train.gk ? '👑 GKテスト中（記録なし）' : train.pvp ? '🤝 PvPテスト中（記録なし）' : '🧪 テスト対戦中（記録なし）')
      : '🏃 訓練中（体力は減りません）';
    // game82: 相手の顔と名前（train.foeFace）。訓練・テストとも表示専用で、sim の結果には影響しない
    var tFace82 = train.foeFace || null;
    var tHist82 = st.history && st.history.length ? st.history[st.history.length - 1] : null;
    // game86: 再生中は表示HP（dispHp）と「再生し終えた攻撃」のダメージだけを見せる
    var tDisp86 = train.dispHp || null;
    var tDmg82 = animating86 ? train.lastDmg86 : (tHist82 && tHist82.damage ? tHist82.damage : null);
    var tMeP82 = myEntry();
    var head = '<div class="panel">' + battleTop82(headLabel, turnRing82(st.turnNo, 'ターン', st.turnNo / 20))
      + sideCard82({ img: tFace82 ? tFace82.img : null, name: tFace82 ? tFace82.name : foe.nickname, attr: foe.attr, level: foe.level, hp: tDisp86 ? tDisp86[1] : foe.hp, hpMax: foe.hpStart || 100, isFoe: true, charging: foe.charging, skill: null })
      + vsZone82(tDmg82, (tDisp86 ? tDisp86[0] : me.hp) * 100 / (me.hpStart || 100), (tDisp86 ? tDisp86[1] : foe.hp) * 100 / (foe.hpStart || 100))
      + sideCard82({ img: train.myFace ? train.myFace.img : (tMeP82 ? mainImg(tMeP82) : null), name: me.nickname, attr: me.attr, level: me.level, hp: tDisp86 ? tDisp86[0] : me.hp, hpMax: me.hpStart || 100, isFoe: false, chargeBuff: me.chargeBuff, skill: me.skill });
    if (st.finished && animating86) {
      // game86: 最後の攻撃モーションが終わるまで結果（勝敗BGM・結果画面）は出さない
      box.innerHTML = head + '<div class="note" style="margin-top:12px;">対戦が終わりました…</div></div>' + trainHistHtml();
      return;
    }
    if (st.finished) {
      if (!train.resultPlayed) {
        train.resultPlayed = true;
        // game90: 訓練・テストの結果音も、本番と同じ結果BGM（bgm.win/lose/draw）への切り替えにする
        if (st.winner === null) playResultBgm90('draw');
        else if (st.winner === 0) playResultBgm90('win');
        else playResultBgm90('lose');
      }
      var title = st.winner === null ? '引き分け' : (st.winner === 0 ? '🎉 勝ち！' : '負け…');
      // game93: お試しプレイの結果画面（記録なしの案内＋お試し専用ボタン）
      if (train.trial) {
        box.innerHTML = head + '<div class="ptitle" style="margin-top:12px;">' + title + '</div>'
          + '<div class="note">🎮 お試しプレイの結果です。本番では自分のキャラで戦えます。配信に遊びに来ると、ラジオネームと自分のキャラがもらえるよ。</div>'
          + '<div style="margin-top:10px;">'
          + '<button class="btn" id="trialAgainBtn" type="button">もう一度お試しする</button> '
          + '<button class="btn small" id="trialReselectBtn" type="button">キャラを選び直す</button> '
          + '<button class="btn small" id="trialTitleBtn" type="button">タイトルへもどる</button></div></div>' + trainHistHtml();
        el('trialAgainBtn').addEventListener('click', function () { if (trialChar127) startTrialCharBattle127(trialChar127); else if (trialMob93) startTrialBattle93(trialMob93); });
        el('trialReselectBtn').addEventListener('click', function () { train = null; showTrialSelect93(); });
        el('trialTitleBtn').addEventListener('click', function () { backToTitle93(); });
        return;
      }
      var left = trainingLeft();
      // テスト対戦のリザルト注記（game81）: 勝利EXPは本番の計算式（winExpFor／GK固定表）で
      // 参考表示するだけで、精算はしない
      var testNote = '';
      if (train.test) {
        if (train.gk) {
          testNote = st.winner === 0
            ? '🧪 GKテストに勝利！ 勝利EXP +' + train.gk.winExp + '（参考表示・精算されません）。自キャラへのバフ ×' + train.gk.buff + ' を適用して戦いました。'
            : '🧪 GKテストの結果です。EXP・BP・戦績は本番データに反映されません。';
        } else if (train.pvp) {
          testNote = '🤝 PvPテスト対戦の結果です。'
            + (st.winner === 0 ? '獲得EXP +' + winExpFor({ mode: 'pvp', winnerLevel: st.participants[0].level, loserLevel: st.participants[1].level }) + '（参考表示・精算されません）。' : '')
            + '本番データには影響しません。';
        } else {
          testNote = '🧪 テスト対戦の結果です。'
            + (st.winner === 0 ? '獲得EXP +' + winExpFor({ mode: 'npc', winnerLevel: st.participants[0].level, loserLevel: st.participants[1].level }) + '（参考表示）。' : '')
            + 'EXP・BP・戦績は本番データに反映されません。';
        }
      }
      box.innerHTML = head + '<div class="ptitle" style="margin-top:12px;">' + title + '</div>'
        + (train.test
          ? '<div class="note">' + testNote + '</div>'
          : '<div class="note">対戦ログを bot に預けました。EXP の精算は bot の次回起動時に行われます。' + (st.winner === 0 ? '勝ったので、精算されると EXP が入ります。' : '勝ったときだけ EXP が入ります。') + '</div>')
        + '<div style="margin-top:10px;">'
        + (train.test
          ? '<button class="btn" id="trainAgainBtn" type="button">' + (train.gk ? '段階を選び直す（GK・テスト）' : train.pvp ? 'もう一度PvPテスト対戦する' : 'もう一度テスト対戦する') + '</button> '
          : (left > 0 ? '<button class="btn" id="trainAgainBtn" type="button">もう一度訓練する（あと ' + left + ' 回）</button> ' : ''))
        + '<button class="btn small" id="trainLobbyBtn" type="button">ロビーへ</button></div></div>' + trainHistHtml();
      if (el('trainAgainBtn')) el('trainAgainBtn').addEventListener('click', function () {
        if (train && train.test) {
          if (train.gk) { switchView('gk'); return; }
          if (train.pvp) { startTestPvp(); return; }
          startTestBattle(train.npcLevel);
          return;
        }
        startTraining();
      });
      el('trainLobbyBtn').addEventListener('click', function () { switchView('lobby'); });
      return;
    }
    var cd = me.attrCooldown || 0;
    var controls = '<div class="ptitle" style="margin-top:12px;">あなたの手番</div>'
      + cmdCards82('train', { cd: cd, dis: animating86, chargeSel: !!me.chargeBuff })
      + '<div class="note">' + (train.trial ? 'お試しプレイはいつでもやめられます（記録は残りません）。' : train.test ? 'テスト対戦はいつでもやめられます。' : '訓練はいつでもやめられます（途中でやめた対戦は記録されません）。') + '</div>'
      + '<div style="margin-top:8px;"><button class="btn small" id="trainQuitBtn" type="button">' + (train.trial ? 'お試しをやめる' : '訓練をやめる') + '</button></div>';
    box.innerHTML = head + controls + '</div>' + trainHistHtml();
    var btns = box.querySelectorAll('[data-tmove]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { trainChoose(this.getAttribute('data-tmove')); });
    }
    el('trainQuitBtn').addEventListener('click', function () {
      var wasTrial93 = !!(train && train.trial);
      train = null;
      if (battleBgm) { battleBgm.pause(); battleBgm = null; }
      battleBgmSlot = null;
      // game85: 途中でやめてロビーへ戻るときもタイトルBGMを再開する
      startTitleBgm();
      // game93: お試しプレイの途中終了はロビーではなくキャラ選択へ戻る
      if (wasTrial93) { showTrialSelect93(); return; }
      switchView('lobby');
    });
  }
  function trainHistHtml() {
    if (!train || !train.state || !train.state.history.length) return '';
    var hist = train.state.history;
    var names = [train.state.participants[0].nickname, train.state.participants[1].nickname];
    // game82: 相手はモブの名前で表示する（表示専用。sim の記録には影響しない）
    if (train.foeFace) names[1] = train.foeFace.name;
    var lines = '';
    var start = Math.max(0, hist.length - 8);
    for (var i = hist.length - 1; i >= start; i--) {
      var h = hist[i];
      var who = esc(names[h.side] || '');
      var act = h.choice === 'charge' ? '間を取った' : (h.choice === 'attr' ? 'シグネチャーボイス！ ' + h.damage + 'ダメージ' : 'マイクアタック ' + h.damage + 'ダメージ');
      lines += '<div class="logline"><span class="lt">▶ T' + h.turnNo + '</span> ' + who + ': ' + act + (h.skill ? ' <span class="note">✨' + esc(h.skill) + '</span>' : '') + '</div>';
    }
    return '<div class="panel logPanel"><div class="ptitle">バトルログ</div>' + lines + '</div>';
  }
  function checkResume() {
    if (!token || !myHash) return;
    sendIntent('resume', {}, function (ok) {
      var entry = myEntry();
      var bid = ok && entry && entry.lastAction ? entry.lastAction.battleId : null;
      if (bid) { resumeBattleId = bid; renderAll(); }
    });
  }
  setInterval(function () {
    var t = el('turnTimer');
    if (t && mirror && mirror.turnEndsAt) {
      var left = Math.max(0, Math.ceil((Date.parse(mirror.turnEndsAt) - Date.now()) / 1000));
      t.textContent = left;
      // 円形タイマー（game82）: 残り秒数をリングの進み具合にも反映する（1ターンは30秒前提で割合化）
      var fg = el('turnRingFg');
      if (fg) {
        var circ = 2 * Math.PI * 26;
        var frac = Math.max(0, Math.min(1, left / 30));
        fg.setAttribute('stroke-dashoffset', (circ * (1 - frac)).toFixed(1));
      }
    }
  }, 250);

  loadSounds();
  loadData();
  setInterval(loadData, 30000);
})();
</script>
