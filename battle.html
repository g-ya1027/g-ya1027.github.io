<!DOCTYPE html>
<!-- spoon-battle-page v9 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚔️ バトルゲーム | Spoon</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; color: #eef2ff; background-color: #0d1030;
    background-image: radial-gradient(620px 320px at 12% -5%, rgba(0,209,178,.20), rgba(0,209,178,0) 60%), radial-gradient(720px 360px at 92% -10%, rgba(88,80,236,.30), rgba(88,80,236,0) 60%), radial-gradient(560px 520px at 50% 112%, rgba(30,27,75,.9), rgba(30,27,75,0) 62%), radial-gradient(circle, rgba(255,255,255,.45) 1px, rgba(255,255,255,0) 1.7px);
    background-size: auto, auto, auto, 110px 110px; background-attachment: fixed; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 44px; }
  .topbar { display: flex; align-items: center; gap: 10px; }
  h1.title { flex: 1; text-align: center; margin: 2px 0 0; font-size: 30px; font-weight: 900; letter-spacing: .04em;
    background: linear-gradient(180deg, #eafffa 5%, #7dfce8 40%, #00d1b2 70%, #b8fff2 96%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #063f36) drop-shadow(0 8px 16px rgba(0,0,0,.55)); }
  .lamp { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; border: 1px solid #4b4f8f; color: #9d92d6; background: rgba(13,16,48,.7); white-space: nowrap; }
  .lamp.on { color: #fff; border-color: #ff3b30; background: rgba(120,10,10,.55); box-shadow: 0 0 10px rgba(255,59,48,.55); }
  .iconBtn { font-size: 18px; line-height: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid #4b4f8f; background: rgba(20,24,64,.85); color: #eef2ff; cursor: pointer; }
  .soundBar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; padding: 8px 10px; border: 1px solid #3d4276; border-radius: 12px; background: rgba(20,24,64,.8); }
  .sbLabel { font-size: 12px; font-weight: 800; color: #b9c2ff; white-space: nowrap; }
  .sbSeg { display: flex; gap: 4px; }
  .segBtn { padding: 6px 9px; font-size: 12px; font-weight: 800; border-radius: 999px; border: 1px solid #3d4276; background: rgba(13,16,48,.7); color: #b9c2ff; cursor: pointer; white-space: nowrap; }
  .segBtn.sel { border-color: #00d1b2; color: #eafffa; background: rgba(0,80,66,.55); }
  .sbVol { flex: 1; min-width: 56px; accent-color: #00d1b2; }
  .sbVolVal { font-size: 12px; font-weight: 700; color: #b9c2ff; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
  .sub { text-align: center; font-size: 13px; color: #b9c2ff; line-height: 1.7; margin: 8px 0 12px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 14px; }
  .tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 15px; font-weight: 800; border-radius: 12px; border: 2px solid #3d4276; background: rgba(20,24,64,.8); color: #b9c2ff; cursor: pointer; }
  .tab.sel { border-color: #00d1b2; color: #eafffa; background: rgba(0,80,66,.55); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: linear-gradient(180deg, rgba(31,36,86,.94), rgba(15,18,52,.96)); border: 2px solid #3d4276; border-radius: 16px; padding: 12px; box-shadow: 0 8px 18px rgba(0,0,0,.45); cursor: pointer; }
  .card.mine { border-color: #00d1b2; }
  .card .img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; background: #232763; display: block; }
  .card .ph { width: 100%; aspect-ratio: 1/1; border-radius: 10px; background: #232763; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .nick { font-size: 15px; font-weight: 900; margin-top: 8px; word-break: break-all; }
  .radio { font-size: 12px; color: #8fd8ff; margin-top: 2px; word-break: break-all; }
  .meta { font-size: 12px; color: #b9c2ff; margin-top: 4px; line-height: 1.6; }
  .attrBadge { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: rgba(0,209,178,.18); border: 1px solid #00d1b2; color: #7dfce8; }
  .panel { background: linear-gradient(180deg, rgba(31,36,86,.94), rgba(15,18,52,.96)); border: 2px solid #3d4276; border-radius: 16px; padding: 16px; box-shadow: 0 8px 18px rgba(0,0,0,.45); }
  .panel h2 { margin: 0 0 10px; font-size: 19px; }
  .barWrap { background: #141842; border-radius: 999px; height: 14px; overflow: hidden; border: 1px solid #3d4276; }
  .barFill { height: 100%; background: linear-gradient(90deg, #00d1b2, #7dfce8); }
  .barFill.hp { background: linear-gradient(90deg, #37d67a, #b6f09c); }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; }
  .row .grow { flex: 1; }
  .btn { display: inline-block; padding: 10px 16px; font-size: 15px; font-weight: 800; border-radius: 12px; border: 2px solid #00d1b2; background: rgba(0,80,66,.6); color: #eafffa; cursor: pointer; }
  .btn.sub2 { border-color: #3d4276; background: rgba(20,24,64,.85); color: #b9c2ff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.small { padding: 5px 12px; font-size: 13px; }
  .note { font-size: 12px; color: #9d92d6; line-height: 1.7; }
  .warn { background: rgba(120,80,0,.35); border: 1px solid #d9a441; border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.7; margin: 0 0 14px; }
  .rankRow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(20,24,64,.7); border: 1px solid #3d4276; margin: 0 0 8px; font-size: 14px; }
  .rankNo { font-size: 18px; font-weight: 900; width: 30px; text-align: center; color: #ffd34d; }
  .frame-gold { border-color: #ffd34d !important; box-shadow: 0 0 14px rgba(255,211,77,.45), 0 8px 18px rgba(0,0,0,.45); }
  .frame-silver { border-color: #cfd6e4 !important; box-shadow: 0 0 10px rgba(207,214,228,.35), 0 8px 18px rgba(0,0,0,.45); }
  .frame-bronze { border-color: #d08a4e !important; box-shadow: 0 0 10px rgba(208,138,78,.35), 0 8px 18px rgba(0,0,0,.45); }
  .titleChip { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: rgba(255,211,77,.16); border: 1px solid #ffd34d; color: #ffe9a3; }
  .crownBadge { font-size: 15px; }
  .foot { text-align: center; color: #9d92d6; font-size: 12px; margin-top: 16px; line-height: 1.7; }
  #startOverlay { position: fixed; inset: 0; background: rgba(5,6,24,.88); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #startOverlay .box { text-align: center; padding: 20px; }
  #startBtn { font-size: 20px; padding: 16px 34px; border-radius: 999px; border: 2px solid #00d1b2; background: rgba(0,80,66,.75); color: #eafffa; font-weight: 900; cursor: pointer; box-shadow: 0 0 24px rgba(0,209,178,.5); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="startOverlay"><div class="box">
  <div style="font-size:15px;letter-spacing:.25em;color:#7dfce8;">📻 FMスプニ ON AIR</div>
  <div style="font-size:26px;font-weight:900;margin:10px 0 18px;">⚔️ バトルゲーム</div>
  <button id="startBtn" type="button">タップしてはじめる</button>
  <div class="note" style="margin-top:12px;">音が出るページです（音量・ミュートは上のバーで調整できます）</div>
</div></div>
<div class="wrap">
  <div class="topbar">
    <span class="lamp" id="liveLamp">● OFF AIR</span>
    <h1 class="title">バトルゲーム</h1>
  </div>
  <div class="soundBar" id="soundBar">
    <span class="sbLabel">🔊 音</span>
    <div class="sbSeg">
      <button type="button" class="segBtn" id="modeBtn_normal">通常</button>
      <button type="button" class="segBtn" id="modeBtn_stream">配信優先</button>
      <button type="button" class="segBtn" id="modeBtn_mute">ミュート</button>
    </div>
    <input type="range" class="sbVol" id="volSlider" min="0" max="100" step="1" value="90" aria-label="音量（0〜100%）">
    <span class="sbVolVal" id="volVal">90%</span>
  </div>
  <p class="sub">深夜放送局FMスプニの競演バトル。<br>配信でためた力で、キミのキャラが育っていくよ。</p>
  <div class="tabs">
    <div class="tab sel" id="tabRoster">🎨 名鑑</div>
    <div class="tab hidden" id="tabMine">⚔️ 自分のキャラ</div>
    <div class="tab" id="tabRanking">🏆 ランキング</div>
  </div>
  <div id="viewRoster"></div>
  <div id="viewMine" class="hidden"></div>
  <div id="viewRanking" class="hidden"></div>
  <div id="viewLobby" class="hidden"></div>
  <div id="viewGk" class="hidden"></div>
  <div id="viewQueue" class="hidden"></div>
  <div id="viewBattle" class="hidden"></div>
  <div id="viewTraining" class="hidden"></div>
  <div class="foot" id="footNote">読み込み中…</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
  var DB_URL = "https://podcastse-default-rtdb.firebaseio.com";
  var ROOM_ID = "78f48ea742f74d19a3";
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  var myHash = null;
  var data = null;
  var view = 'roster';
  var detailHash = null;
  var sounds = {};
  var audioCtx = null;
  var bgmAudio = null;
  // __BATTLE_SOUND63_BEGIN__ 音モードと実効音量の純粋関数（サーバ側 battle-pages.js と同じソース）
  function normalizeBattleSoundMode(v) {
  return v === 'stream' || v === 'mute' ? v : 'normal';
}
  function clampBattleMasterVolume(v) {
  var n = typeof v === 'number' ? v : parseFloat(v);
  if (isNaN(n)) return 0.9;
  return Math.min(1, Math.max(0, n));
}
  function effectiveBattleVolume(mode, isBgm, slotVolume, masterVolume) {
  var m = mode === 'stream' || mode === 'mute' ? mode : 'normal';
  if (m === 'mute') return 0;
  if (m === 'stream' && isBgm) return 0;
  var s = typeof slotVolume === 'number' && isFinite(slotVolume) ? Math.min(1, Math.max(0, slotVolume)) : 0.8;
  var mv = typeof masterVolume === 'number' && isFinite(masterVolume) ? Math.min(1, Math.max(0, masterVolume)) : 0.9;
  return s * mv;
}
  // __BATTLE_SOUND63_END__
  var soundMode = 'normal';
  try {
    var savedMode63 = localStorage.getItem('battleSoundMode');
    if (savedMode63) soundMode = normalizeBattleSoundMode(savedMode63);
    else if (localStorage.getItem('battleMuted') === '1') soundMode = 'mute';
  } catch (e) {}
  var masterVol = 0.9;
  try { masterVol = clampBattleMasterVolume(parseFloat(localStorage.getItem('battleVolume'))); } catch (e) {}
  function isBgmSlotId(id) { return typeof id === 'string' && id.indexOf('bgm.') === 0; }
  function effVol(id) { return effectiveBattleVolume(soundMode, isBgmSlotId(id), slotVol(id), masterVol); }

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function effHp(p) {
    if (!p || !p.hp) return 100;
    var stored = p.hp.stored || 0;
    var at = p.hp.updatedAt ? Date.parse(p.hp.updatedAt) : NaN;
    if (isNaN(at)) return Math.min(100, stored);
    var gain = Math.floor((Date.now() - at) / 600000);
    return Math.max(0, Math.min(100, stored + Math.max(0, gain)));
  }
  function myEntry() {
    if (!data || !myHash) return null;
    for (var i = 0; i < data.people.length; i++) if (data.people[i].tokenHash === myHash) return data.people[i];
    return null;
  }
  function entryByHash(h) {
    if (!data) return null;
    for (var i = 0; i < data.people.length; i++) if (data.people[i].tokenHash === h) return data.people[i];
    return null;
  }

  // ---- 音（§9.7）: マニフェストを読んでスロット再生。未設定なら無音で進む ----
  function loadSounds() {
    fetch('battle-sounds.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (j && j.slots) sounds = j.slots;
    }).catch(function () {});
  }
  function slotVol(id) { var s = sounds[id]; return s && typeof s.volume === 'number' ? s.volume : 0.8; }
  function playSlot(id, loop) {
    var v = effVol(id);
    if (v <= 0) return null;
    var s = sounds[id];
    if (!s || !s.url) return null;
    try {
      var a = new Audio(s.url);
      a.volume = v;
      a.loop = !!loop;
      a.play().catch(function () {});
      return a;
    } catch (e) { return null; }
  }
  function startTitleBgm() {
    if (bgmAudio) return;
    bgmAudio = playSlot('bgm.title', true);
  }
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
    startTitleBgm();
  }

  // ---- intent 送信（§9.4.3） ----
  function newRequestId() { return 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
  function sendIntent(kind, extra, done) {
    if (!DB_URL || !ROOM_ID || !myHash) { if (done) done(false, '中継が設定されていません'); return; }
    var body = { kind: kind, tokenHash: myHash, requestId: newRequestId(), t: Date.now() };
    if (extra) for (var k in extra) body[k] = extra[k];
    fetch(DB_URL + '/rooms/' + encodeURIComponent(ROOM_ID) + '/battleOps.json', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error('送信に失敗しました');
      waitAck(body.requestId, done);
    }).catch(function () { if (done) done(false, '送信できませんでした'); });
  }
  function waitAck(requestId, done) {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      loadData(function () {
        var me = myEntry();
        if (me && me.lastAction && me.lastAction.requestId === requestId) {
          clearInterval(timer);
          if (done) done(me.lastAction.ok, me.lastAction.reason || '');
        } else if (tries >= 5) {
          clearInterval(timer);
          if (done) done(false, 'botからの返事がありませんでした（配信中だけ処理されます）');
        }
      });
    }, 3000);
  }

  // ---- 描画 ----
  function attrBadge(p) { return p.attr ? '<span class="attrBadge">' + esc(p.attr) + '属性</span>' : (p.status === 'awaiting' ? '<span class="attrBadge">属性は未確定</span>' : ''); }
  // 称号・フレーム・王冠（Phase 2A）: people は honors 入れ子、ranking は直下に持つので両対応にする
  function honorsOf(x) { return x && x.honors ? x.honors : x; }
  function frameClass(x) { var h = honorsOf(x); return h && h.frame ? ' frame-' + h.frame : ''; }
  function crownHtml(x) { var h = honorsOf(x); return h && h.crown ? '<span class="crownBadge">👑</span> ' : ''; }
  function titleChip(x) { var h = honorsOf(x); return h && h.titleText ? '<span class="titleChip">' + esc(h.titleText) + '</span>' : ''; }
  // 自分の順位・フレームが前回の読み込みより良くなったら se.ranking を鳴らす（Phase 2A）
  var prevMyHonors = null;
  function frameScore(h) { if (!h) return 0; if (h.frame === 'gold') return 3; if (h.frame === 'silver') return 2; if (h.frame === 'bronze') return 1; return 0; }
  function checkRankingSound() {
    var me = myEntry();
    var cur = me ? me.honors : null;
    if (prevMyHonors && cur) {
      var improved = frameScore(cur) > frameScore(prevMyHonors)
        || (!prevMyHonors.titleId && !!cur.titleId)
        || (cur.rank != null && prevMyHonors.rank != null && cur.rank < prevMyHonors.rank && cur.rank <= 3);
      if (improved) playSlot('se.ranking');
    }
    if (cur) prevMyHonors = cur;
  }
  // バトル用イラスト（Phase 4）: 値は単体パス文字列または { a, b }（evo ペア）。選択中の側を優先する
  function imgVal(v, p) {
    if (!v) return null;
    if (typeof v === 'string') return v;
    return (p && p.chosen === 'b' ? v.b : v.a) || v.a || v.b || null;
  }
  // 表示するメイン絵: 進化絵（段階に合うもの）＞ 金ランク絵（王冠保持中）＞ 通常絵
  function mainImg(p) {
    var il = (p && p.illust) || {};
    if (p.evolutionStage >= 2 && il.evo2) return imgVal(il.evo2, p);
    if (p.evolutionStage >= 1 && il.evo1) return imgVal(il.evo1, p);
    if (p.honors && p.honors.crown && il.gold) return imgVal(il.gold, p);
    return p.img;
  }
  // 自分の進化段階が上がったら（取り込みで確定したら） se.evolution を鳴らす（Phase 4）
  var prevMyStage = null;
  function checkEvolutionSound() {
    var me = myEntry();
    var cur = me ? (me.evolutionStage || 0) : null;
    if (prevMyStage != null && cur != null && cur > prevMyStage) playSlot('se.evolution');
    if (cur != null) prevMyStage = cur;
  }
  function renderRoster() {
    var box = el('viewRoster');
    if (!data) { box.innerHTML = '<p class="note">読み込み中…</p>'; return; }
    if (detailHash) { renderDetail(box); return; }
    if (!data.people.length) { box.innerHTML = '<p class="note">まだキャラがいません。ラジオネームのイラストが完成すると、ここに登場します。</p>'; return; }
    var me = myEntry();
    var html = '<div class="grid">';
    data.people.forEach(function (p) {
      var mine = me && p.tokenHash === me.tokenHash;
      var mImg = mainImg(p);
      html += '<div class="card' + (mine ? ' mine' : '') + frameClass(p) + '" data-hash="' + esc(p.tokenHash || '') + '">'
        + (mImg ? '<img class="img" src="' + esc(mImg) + '" alt="">' : '<div class="ph">🎨</div>')
        + '<div class="nick">' + crownHtml(p) + esc(p.nickname) + (mine ? '（あなた）' : '') + '</div>'
        + '<div class="radio">📻 ' + esc(p.radioName) + '</div>'
        + (titleChip(p) ? '<div style="margin-top:4px;">' + titleChip(p) + '</div>' : '')
        + '<div class="meta">' + attrBadge(p) + ' Lv' + p.level + ' ／ 体力 ' + effHp(p) + '</div>'
        + '</div>';
    });
    html += '</div>';
    box.innerHTML = html;
    var cards = box.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) cards[i].addEventListener('click', function () {
      playSlot('se.uiTap');
      detailHash = this.getAttribute('data-hash');
      renderRoster();
    });
  }
  function renderDetail(box) {
    var p = entryByHash(detailHash);
    if (!p) { detailHash = null; renderRoster(); return; }
    var rec = p.record || {};
    var mImg = mainImg(p);
    var goldImg = imgVal((p.illust || {}).gold, p);
    box.innerHTML = '<div class="panel' + frameClass(p) + '"><h2>' + crownHtml(p) + esc(p.nickname) + '</h2>'
      + '<div class="radio">📻 ラジオネーム『' + esc(p.radioName) + '』</div>'
      + (titleChip(p) ? '<div style="margin-top:6px;">' + titleChip(p) + (p.honors && p.honors.rank ? ' <span class="note">ランキング ' + p.honors.rank + '位</span>' : '') + '</div>' : '')
      + (mImg ? '<img class="img" style="width:100%;border-radius:10px;margin-top:10px;" src="' + esc(mImg) + '" alt="">' : '')
      + (goldImg && goldImg !== mImg ? '<div class="meta" style="margin-top:10px;">👑 金ランク記念イラスト</div><img class="img" style="width:100%;border-radius:10px;margin-top:6px;" src="' + esc(goldImg) + '" alt="">' : '')
      + '<div class="meta" style="margin-top:10px;">' + attrBadge(p) + ' Lv' + p.level + '（通算EXP ' + p.exp + '）</div>'
      + '<div class="meta">攻撃 ' + p.params.atk + ' ／ 防御 ' + p.params.def + ' ／ 属性値 ' + p.params.attrValue + '</div>'
      + '<div class="meta">体力 ' + effHp(p) + ' / 100</div>'
      + '<div class="meta">戦績: NPC ' + (rec.npcWin || 0) + '勝' + (rec.npcLose || 0) + '敗 ／ PvP ' + (rec.pvpWin || 0) + '勝' + (rec.pvpLose || 0) + '敗 ／ GK ' + (rec.gkWin || 0) + '勝</div>'
      + '<div style="margin-top:12px;"><button class="btn sub2" id="backBtn" type="button">← 名鑑にもどる</button></div></div>';
    el('backBtn').addEventListener('click', function () { playSlot('se.uiCancel'); detailHash = null; renderRoster(); });
  }
  // 進化の進み具合（Phase 4・§9.1.9）: 段階・条件の進捗・生成待ちを表示する
  function evolutionHtml(me) {
    var ev = me.evolution || {};
    var stage = ev.stage != null ? ev.stage : (me.evolutionStage || 0);
    var html = '<div class="meta" style="margin-top:10px;">🌟 進化: ' + (stage >= 2 ? '最終進化済み！' : stage === 1 ? '第1進化済み' : '未進化') + '</div>';
    if (stage < 2 && ev.nextKind) {
      var winsLabel = ev.winsKind === 'pvp' ? 'PvP勝利' : 'バトル勝利';

  function trainingResultsHtml() {

  }
