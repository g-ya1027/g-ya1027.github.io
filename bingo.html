<!DOCTYPE html>
<!-- spoon-bingo-page v1 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎉 ビンゴ大会 | Spoon bot</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #17181c; color: #eee; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
  h1 { font-size: 21px; margin: 6px 0 2px; }
  .sub { color: #aaa; font-size: 12px; margin-bottom: 12px; }
  .status { background: #22232a; border: 1px solid #3a3b44; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.7; margin-bottom: 14px; }
  .drawnNums { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .drawnNums span { background: #2f6fb4; color: #fff; border-radius: 999px; min-width: 26px; text-align: center; padding: 2px 4px; font-size: 12px; }
  .plist { display: flex; flex-direction: column; gap: 8px; }
  .prow { display: flex; align-items: center; gap: 8px; background: #22232a; border: 1px solid #3a3b44; border-radius: 10px; padding: 10px 12px; font-size: 15px; cursor: pointer; text-align: left; width: 100%; color: #eee; }
  .prow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; border-radius: 999px; padding: 2px 8px; background: #444; color: #ddd; white-space: nowrap; }
  .badge.reach { background: #b45a1b; color: #fff; }
  .badge.bingo { background: #c22f4d; color: #fff; font-weight: 700; }
  .cardBox { background: #22232a; border: 1px solid #3a3b44; border-radius: 12px; padding: 14px; }
  table.bcard { border-collapse: separate; border-spacing: 4px; margin: 10px auto; }
  table.bcard td { width: 52px; height: 52px; text-align: center; vertical-align: middle; border-radius: 10px; background: #2c2e36; font-size: 18px; font-weight: 700; }
  table.bcard td.hit { background: #2f6fb4; color: #fff; }
  table.bcard td.free { background: #6b5aa8; color: #fff; }
  .backBtn, .reloadBtn { font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid #666; background: #2c2e36; color: #eee; cursor: pointer; }
  .empty { color: #aaa; font-size: 14px; padding: 18px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎉 ビンゴ大会</h1>
  <div class="sub">参加者一覧です。名前をタップすると、その人のカードと達成状況が見られます。（自動で更新されます）</div>
  <div class="status" id="statusBox">読み込み中…</div>
  <div id="main"></div>
</div>
<script>
  var drawnSet = {};
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var state = null;
  var selected = -1;
  function phaseLabel(s) {
    if (!s) return '読み込み中…';
    if (s.phase === 'entry') return '🟢 参加受付中（' + s.players.length + '人）…「!参加」で参加してね';
    if (s.phase === 'drawing') return '🎱 抽選中（' + s.players.length + '人／出た番号 ' + s.drawnCount + '個／ビンゴ ' + s.winnersCount + '/' + s.endCount + '人）';
    if (s.phase === 'finished') return '🏁 終了しました（ビンゴ ' + s.winnersCount + '人）。参加ありがとうございました！';
    return 'まだ始まっていません';
  }
  function render() {
    var box = document.getElementById('statusBox');
    var main = document.getElementById('main');
    if (!state) { box.textContent = '読み込み中…'; return; }
    drawnSet = {};
    (state.drawn || []).forEach(function (n) { drawnSet[n] = true; });
    var html = esc(phaseLabel(state));
    if (state.drawn && state.drawn.length) {
      html += '<div class="drawnNums">' + state.drawn.map(function (n) { return '<span>' + n + '</span>'; }).join('') + '</div>';
    }
    box.innerHTML = html;
    if (selected >= 0 && state.players[selected]) { renderCard(state.players[selected]); return; }
    if (!state.players.length) { main.innerHTML = '<div class="empty">まだ参加者がいません</div>'; return; }
    var rows = state.players.map(function (p, i) {
      var badge = p.bingo ? '<span class="badge bingo">🎉 ビンゴ！</span>' : (p.reach ? '<span class="badge reach">🔥 リーチ</span>' : '<span class="badge">' + p.markedCount + '/25</span>');
      return '<button type="button" class="prow" data-i="' + i + '"><span class="nm">' + esc(p.nickname) + '</span>' + badge + '<span>›</span></button>';
    }).join('');
    main.innerHTML = '<div class="plist">' + rows + '</div>';
    Array.prototype.forEach.call(main.querySelectorAll('.prow'), function (b) {
      b.onclick = function () { selected = Number(b.getAttribute('data-i')); render(); };
    });
  }
  function renderCard(p) {
    var main = document.getElementById('main');
    var badge = p.bingo ? '🎉 ビンゴ！' : (p.reach ? '🔥 リーチ！' : '当たり ' + p.markedCount + '/25');
    var cells = '';
    for (var r = 0; r < 5; r++) {
      cells += '<tr>';
      for (var c = 0; c < 5; c++) {
        var v = (p.card[c] || [])[r];
        if (v === 0) cells += '<td class="free">★</td>';
        else if (drawnSet[v]) cells += '<td class="hit">' + v + '</td>';
        else cells += '<td>' + v + '</td>';
      }
      cells += '</tr>';
    }
    main.innerHTML = '<div class="cardBox"><button type="button" class="backBtn" id="backBtn">‹ 一覧に戻る</button>' +
      '<h1 style="font-size:18px;margin-top:12px">' + esc(p.nickname) + ' のカード</h1>' +
      '<div>' + badge + '</div><table class="bcard">' + cells + '</table></div>';
    document.getElementById('backBtn').onclick = function () { selected = -1; render(); };
  }
  function load() {
    fetch('bingo.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      state = j;
      if (selected >= (state.players || []).length) selected = -1;
      render();
    }).catch(function () {
      document.getElementById('statusBox').textContent = '読み込めませんでした（まだ大会が始まっていないかもしれません）';
    });
  }
  load();
  setInterval(load, 5000);
</script>
</body>
</html>
