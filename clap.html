<!DOCTYPE html>
<!-- spoon-listener-page v1 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>👏 みんなでドンドンパン！ | リスナーボタン</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; color: #fff;
    background-color: #0b0821;
    background-image: radial-gradient(620px 320px at 12% -5%, rgba(255,46,136,.35), rgba(255,46,136,0) 60%), radial-gradient(720px 360px at 92% -10%, rgba(25,191,255,.30), rgba(25,191,255,0) 60%), radial-gradient(560px 520px at 50% 112%, rgba(123,47,247,.35), rgba(123,47,247,0) 62%);
    min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 10px 12px 26px; }
  h1 { text-align: center; font-size: 21px; margin: 4px 0 2px; letter-spacing: .04em; }
  .sub { text-align: center; font-size: 12.5px; color: #cfc6ff; margin: 0 0 8px; line-height: 1.6; }
  #stage { display: block; width: 100%; height: 300px; border-radius: 14px; background: rgba(10,6,32,.55); border: 2px solid rgba(160,120,255,.45); }
  .speedRow { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .speedRow .lbl { font-size: 13px; color: #cfc6ff; margin-right: 2px; }
  .spd { border: 2px solid rgba(160,120,255,.55); background: rgba(30,20,70,.8); color: #e8e2ff; border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .spd.on { background: linear-gradient(90deg, #e91e63, #7b2ff7); border-color: #ffb3cd; color: #fff; }
  #bpmLabel { text-align: center; font-size: 12px; color: #bdb4e8; margin: 2px 0 8px; }
  .btnRow { display: flex; gap: 12px; }
  .tapBtn { flex: 1; border: none; border-radius: 18px; padding: 20px 6px 16px; font-size: 21px; font-weight: 900; color: #fff; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .tapBtn .emo { display: block; font-size: 40px; line-height: 1.1; }
  #donBtn { background: linear-gradient(180deg, #ff9f43, #e06f00); box-shadow: 0 6px 0 #9a4d00, 0 10px 22px rgba(0,0,0,.5); }
  #panBtn { background: linear-gradient(180deg, #ff5da2, #d81b74); box-shadow: 0 6px 0 #8f0f4c, 0 10px 22px rgba(0,0,0,.5); }
  .tapBtn:active { transform: translateY(4px); }
  #donBtn:active { box-shadow: 0 2px 0 #9a4d00; }
  #panBtn:active { box-shadow: 0 2px 0 #8f0f4c; }
  .tapBtn.sent { filter: brightness(1.45); }
  #status { text-align: center; font-size: 12.5px; color: #bdb4e8; margin-top: 12px; min-height: 18px; }
  .foot { text-align: center; color: #9d92d6; font-size: 11.5px; margin-top: 10px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>👏 みんなでドンドンパン！</h1>
  <p class="sub">バーが下のラインに重なるタイミングで、同じ色のボタンを押してね。<br>押した音は配信に流れます。みんなで息を合わせよう！</p>
  <canvas id="stage"></canvas>
  <div class="speedRow"><span class="lbl">速度</span><span id="speedBtns"></span></div>
  <div id="bpmLabel"></div>
  <div class="btnRow">
    <button type="button" class="tapBtn" id="donBtn"><span class="emo">🦶</span>ドン</button>
    <button type="button" class="tapBtn" id="panBtn"><span class="emo">👏</span>パン</button>
  </div>
  <div id="status">読み込み中…</div>
  <div class="foot">バーのタイミングは全員で同期しています（開いた時刻には影響されません）。<br>音が出るまで少し（1秒くらい）遅れることがあります。</div>
</div>
<script>
  var DB_URL = 'https://podcastse-default-rtdb.firebaseio.com';
  var ROOM_ID = '78f48ea742f74d19a3';
  var SPEEDS = [60, 72, 81, 96, 110];
  var PATTERN = [ { off: 0, type: 'don' }, { off: 1, type: 'don' }, { off: 2, type: 'pan' } ];
  var speedIdx = 2;
  try {
    var saved = parseInt(localStorage.getItem('lbSpeed') || '2', 10);
    if (saved >= 0 && saved < SPEEDS.length) speedIdx = saved;
  } catch (e) {}
  var statusEl = document.getElementById('status');
  var bpmEl = document.getElementById('bpmLabel');
  var speedBtns = document.getElementById('speedBtns');
  function renderSpeed() {
    speedBtns.innerHTML = '';
    SPEEDS.forEach(function (bpm, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'spd' + (i === speedIdx ? ' on' : '');
      b.textContent = String(i + 1);
      b.onclick = function () {
        speedIdx = i;
        try { localStorage.setItem('lbSpeed', String(i)); } catch (e) {}
        renderSpeed();
      };
      speedBtns.appendChild(b);
    });
    bpmEl.textContent = 'いまの速度: ' + SPEEDS[speedIdx] + ' BPM（DJの合図に合わせてね）';
  }
  renderSpeed();
  function beatNow() { return (Date.now() / 1000) * (SPEEDS[speedIdx] / 60); }
  // バーの描画（2レーンのハイウェイを canvas に描く）
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var floats = [];
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();
  var COLORS = { don: '#ff9f43', pan: '#ff5da2' };
  function draw() {
    var W = canvas.clientWidth, H = canvas.clientHeight;
    var horizonY = H * 0.07, lineY = H * 0.82, cx = W / 2;
    ctx.clearRect(0, 0, W, H);
    function halfW(d) { var p = 1 - d / 5; return W * (0.05 + 0.40 * Math.pow(Math.max(p, 0), 1.5)); }
    function yOf(d) { var p = 1 - d / 5; return horizonY + (lineY - horizonY) * Math.pow(Math.max(p, 0), 2); }
    // ハイウェイ本体
    ctx.beginPath();
    ctx.moveTo(cx - halfW(5), horizonY);
    ctx.lineTo(cx + halfW(5), horizonY);
    ctx.lineTo(cx + halfW(0), lineY + 26);
    ctx.lineTo(cx - halfW(0), lineY + 26);
    ctx.closePath();
    ctx.fillStyle = 'rgba(46,28,110,.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(190,150,255,.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 中央の仕切り
    ctx.beginPath();
    ctx.moveTo(cx, horizonY);
    ctx.lineTo(cx, lineY + 26);
    ctx.strokeStyle = 'rgba(190,150,255,.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 判定ライン
    ctx.beginPath();
    ctx.moveTo(cx - halfW(0) - 8, lineY);
    ctx.lineTo(cx + halfW(0) + 8, lineY);
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // バー
    var beat = beatNow();
    var base = Math.floor(beat / 4) * 4 - 4;
    for (var b = base; b < beat + 6; b += 4) {
      for (var i = 0; i < PATTERN.length; i++) {
        var ev = PATTERN[i];
        var d = (b + ev.off) - beat;
        if (d < -0.35 || d > 5) continue;
        var p = 1 - d / 5;
        var y = yOf(d);
        var hw = halfW(d);
        var laneCx = ev.type === 'don' ? cx - hw / 2 : cx + hw / 2;
        var bw = hw * 0.8, bh = 5 + 15 * p * p;
        ctx.fillStyle = COLORS[ev.type];
        ctx.globalAlpha = d < 0 ? Math.max(0, 1 + d * 2.4) : 0.55 + 0.45 * p;
        if (Math.abs(d) < 0.13) { ctx.shadowColor = COLORS[ev.type]; ctx.shadowBlur = 18; }
        ctx.beginPath();
        ctx.roundRect(laneCx - bw / 2, y - bh / 2, bw, bh, 5);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }
    // レーン名
    ctx.fillStyle = '#ffd9a8';
    ctx.font = '900 17px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🦶 ドン', cx - halfW(0) / 2, lineY + 22);
    ctx.fillStyle = '#ffc2da';
    ctx.fillText('👏 パン', cx + halfW(0) / 2, lineY + 22);
    // 浮かぶ判定文字
    var now = performance.now();
    floats = floats.filter(function (f) { return now - f.at < 700; });
    floats.forEach(function (f) {
      var age = (now - f.at) / 700;
      ctx.globalAlpha = 1 - age;
      ctx.fillStyle = f.color;
      ctx.font = '900 22px sans-serif';
      ctx.fillText(f.text, f.x * W, lineY - 34 - age * 26);
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  // タップ送信
  var lastTapAt = { don: 0, pan: 0 };
  function nearestDiff(type) {
    var beat = beatNow();
    var best = 99;
    var base = Math.floor(beat / 4) * 4 - 4;
    for (var b = base; b < beat + 6; b += 4) {
      for (var i = 0; i < PATTERN.length; i++) {
        if (PATTERN[i].type !== type) continue;
        var diff = Math.abs((b + PATTERN[i].off) - beat);
        if (diff < best) best = diff;
      }
    }
    return best;
  }
  function tap(type, btn) {
    var nowMs = Date.now();
    if (nowMs - lastTapAt[type] < 130) return;
    lastTapAt[type] = nowMs;
    var diff = nearestDiff(type);
    var cxRatio = type === 'don' ? 0.27 : 0.73;
    if (diff < 0.16) floats.push({ text: 'PERFECT!', color: '#ffe066', x: cxRatio, at: performance.now() });
    else if (diff < 0.38) floats.push({ text: 'GOOD', color: '#bdb4e8', x: cxRatio, at: performance.now() });
    btn.classList.add('sent');
    setTimeout(function () { btn.classList.remove('sent'); }, 140);
    if (!DB_URL || !ROOM_ID) { statusEl.textContent = '接続先が未設定です（DJ側の設定待ち）'; return; }
    fetch(DB_URL + '/rooms/' + encodeURIComponent(ROOM_ID) + '/taps.json', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: type, t: nowMs })
    }).then(function (r) {
      statusEl.textContent = r.ok ? '送信しました♪ 音が流れるまで少し待ってね' : '送信できませんでした（時間をおいてもう一度）';
    }).catch(function () {
      statusEl.textContent = '送信できませんでした（通信環境を確認してね）';
    });
  }
  var donBtn = document.getElementById('donBtn');
  var panBtn = document.getElementById('panBtn');
  donBtn.addEventListener('click', function () { tap('don', donBtn); });
  panBtn.addEventListener('click', function () { tap('pan', panBtn); });
  statusEl.textContent = DB_URL ? '準備OK！ DJの合図で押してね' : '接続先が未設定です（DJ側の設定待ち）';
</script>
</body>
</html>
