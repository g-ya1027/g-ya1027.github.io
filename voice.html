<!DOCTYPE html>
<!-- spoon-voice-letter v2 -->
<!-- voice-letter-state: closed -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎙 ボイスおたより</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; color: #fff;
    background-color: #0b0821;
    background-image: radial-gradient(620px 320px at 12% -5%, rgba(255,46,136,.35), rgba(255,46,136,0) 60%), radial-gradient(720px 360px at 92% -10%, rgba(25,191,255,.30), rgba(25,191,255,0) 60%), radial-gradient(560px 520px at 50% 112%, rgba(123,47,247,.35), rgba(123,47,247,0) 62%);
    min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 12px 30px; }
  h1 { text-align: center; font-size: 21px; margin: 4px 0 2px; letter-spacing: .04em; white-space: nowrap; }
  .card { background: rgba(24,16,58,.72); border: 2px solid rgba(160,120,255,.45); border-radius: 14px; padding: 18px 14px; margin-bottom: 12px; text-align: center; }
  .big { font-size: 19px; font-weight: 900; margin: 0 0 8px; white-space: nowrap; }
  .txt { font-size: 13.5px; color: #cfc6ff; line-height: 1.8; margin: 0; }
  .foot { text-align: center; color: #9d92d6; font-size: 11.5px; margin-top: 10px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙 ボイスおたより</h1>
  <div class="card">
    <p class="big">⏸ 今は受付を止めています</p>
    <p class="txt">ボイスおたよりは、配信中に DJ が受付を開始したときだけ送れます。<br>受付が始まったら、このページを開き直してね。</p>
  </div>
  <div class="foot">最長1分の声のおたよりを送れるページです。受付中は録音してそのまま送れます。</div>
</div>
</body>
</html>
