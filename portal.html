<!DOCTYPE html>
<!-- spoon-portal-page v3 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🗿 リスナーページ | Spoon</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; color: #fff; background-color: #0b0821;
    background-image: radial-gradient(620px 320px at 12% -5%, rgba(255,46,136,.38), rgba(255,46,136,0) 60%), radial-gradient(720px 360px at 92% -10%, rgba(25,191,255,.32), rgba(25,191,255,0) 60%), radial-gradient(560px 520px at 50% 112%, rgba(123,47,247,.38), rgba(123,47,247,0) 62%), radial-gradient(circle, rgba(255,255,255,.5) 1px, rgba(255,255,255,0) 1.7px);
    background-size: auto, auto, auto, 110px 110px; background-attachment: fixed; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 14px 40px; }
  .mascot { text-align: center; font-size: 15px; letter-spacing: .25em; color: #ffd9ec; text-shadow: 0 0 10px rgba(255,79,163,.8); }
  h1.title { text-align: center; margin: 4px 0 0; font-size: 40px; font-weight: 900; letter-spacing: .03em; line-height: 1.2;
    background: linear-gradient(180deg, #fff6c9 5%, #ffd34d 35%, #ff9d2e 62%, #ffe98a 96%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #7a2c00) drop-shadow(0 8px 16px rgba(0,0,0,.55)); }
  .sub { text-align: center; font-size: 14px; color: #cfc6ff; line-height: 1.7; margin: 10px 0 18px; }
  a.card { display: flex; align-items: center; gap: 14px; text-decoration: none; color: #fff; margin: 0 0 14px;
    background: linear-gradient(180deg, rgba(43,30,96,.92), rgba(20,14,54,.95)); border: 2px solid #d9a441; border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 18px rgba(0,0,0,.45); }
  a.card:active { transform: translateY(2px); }
  .emo { font-size: 38px; line-height: 1; flex: none; }
  .txt { flex: 1; min-width: 0; }
  .name { font-size: 19px; font-weight: 900; letter-spacing: .02em; }
  .desc { font-size: 13px; color: #cfc6ff; margin-top: 3px; line-height: 1.5; }
  .arrow { font-size: 22px; color: #ffd34d; flex: none; font-weight: 900; }
  .foot { text-align: center; color: #9d92d6; font-size: 12px; margin-top: 8px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mascot">🗿 SPOON 🗿</div>
  <h1 class="title">リスナーページ</h1>
  <p class="sub">遊びに来てくれてありがとう！<br>行きたいページを選んでね。</p>
  <a class="card" href="./">

    <span class="arrow">›</span>
  </a>
  <a class="card" href="ring.html">

    <span class="arrow">›</span>
  </a>
  <a class="card" href="bingo.html">
    <span class="emo">🎉</span>

    <span class="arrow">›</span>
  </a>
  <a class="card" href="clap.html">
    <span class="emo">👏</span>
    <span class="txt"><span class="name">ドンドンパン！</span><div class="desc">配信中にタイミングを合わせてボタンを押してね</div></span>
    <span class="arrow">›</span>
  </a>
  <a class="card" href="chars.html">
    <span class="emo">🎨</span>
    <span class="txt"><span class="name">ラジオネーム名鑑</span><div class="desc">みんなのイメージキャラが見られます</div></span>
    <span class="arrow">›</span>
  </a>
  <a class="card" href="battle.html">
    <span class="emo">⚔️</span>
    <span class="txt"><span class="name">バトルゲーム</span><div class="desc">イメージキャラで対戦できます</div></span>
    <span class="arrow">›</span>
  </a>
  <a class="card" href="battle-settings.html">
    <span class="emo">⚙️</span>
    <span class="txt"><span class="name">ゲーム設定</span><div class="desc">DJ用の設定ページです。合言葉が必要です</div></span>
    <span class="arrow">›</span>
  </a>
  <div class="foot">ページが開かないときは、少し待ってから開き直してね</div>
</div>
</body>
</html>
